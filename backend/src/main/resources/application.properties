# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=270000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Mail (Resend HTTPS API — see EmailService; SMTP is blocked outbound on Render's free tier)
resend.api-key=${RESEND_API_KEY}
# onboarding@resend.dev is Resend's shared sandbox sender, usable with no domain verification —
# swap for a verified custom-domain address once one exists.
resend.from-address=${RESEND_FROM_ADDRESS:onboarding@resend.dev}

# Alpaca System Account (fetching market data only)
alpaca.system.api-key=${ALPACA_SYSTEM_API_KEY}
alpaca.system.api-secret=${ALPACA_SYSTEM_API_SECRET}

# Supabase Auth
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}

# Admin endpoint protection — every /admin/** request must send X-Admin-Key matching this value
admin.secret-key=${ADMIN_SECRET_KEY}

# JSON serialization
spring.jackson.property-naming-strategy=SNAKE_CASE

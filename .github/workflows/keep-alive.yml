name: Keep backend awake

# Pings the live backend every 5 minutes, 24/7, so Render's free tier never spins it down from
# idle. This is a best-effort convenience, not a guarantee — the daily-trading-cron workflow
# doesn't depend on this to work (it wakes the backend itself on each call), and the frontend's
# ConnectingIndicator covers the case where the backend is asleep anyway. A missed ping here is
# silent by design: the next one just fires 5 minutes later.
#
# Hits /health specifically — a public, auth-free endpoint (see HealthController) — rather than
# the bare root, which requires a Supabase JWT and only ever returned 401. A 401 still reaches
# the server and resets Render's idle timer either way, but /health gives a real 200 to confirm
# the ping actually worked, and matches what UptimeRobot's monitor is configured to hit too.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        # Render free-tier cold starts measured at 56-100s live — 30s was too tight and could
        # time out before ever actually waking the server, while still reporting success via the
        # `|| true`. 120s covers the measured range with margin.
        run: curl --silent --max-time 120 "https://momentum-trading-backend.onrender.com/health" || true
